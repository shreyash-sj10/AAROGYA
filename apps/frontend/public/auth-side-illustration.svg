<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Ayurvedic Herbal Still Life</title>
  <desc id="desc">A warm botanical composition used as decorative background for authentication pages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe4d1"/>
      <stop offset="52%" stop-color="#dbe5d6"/>
      <stop offset="100%" stop-color="#cfdac7"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="18%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
